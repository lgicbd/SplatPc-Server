services:
  splatoon-nex:
    build: .
    container_name: splatoon-nex
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - WG_INTERFACE=${WG_INTERFACE:-wg0}
      - WG_SUBNET=${WG_SUBNET:-10.66.0.0/16}
      - WG_SERVER_IP=${WG_SERVER_IP:-10.66.0.1}
      - WG_NNCS2_IP=${WG_NNCS2_IP:-10.66.0.254}
      - WG_MTU=${WG_MTU:-1420}
    ports:
      - "60000:60000/udp"
      - "60001:60001/udp"
      - "10025:10025/udp"
      - "10125:10125/udp"
      - "51820:51820/udp"
    volumes:
      - ./data:/var/lib/splatoon
      - ./logs:/var/log/splatoon
      - ./server.json:/etc/splatoon/server.json:ro
    networks:
      - splatoon_internal

  caddy:
    image: caddy:2-alpine
    container_name: splatoon-caddy
    restart: unless-stopped
    depends_on:
      - splatoon-nex
    environment:
      - SPLATOON_DOMAIN=${SPLATOON_DOMAIN:-localhost}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - splatoon_internal

volumes:
  caddy_data:
  caddy_config:

networks:
  splatoon_internal:
    driver: bridge

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Vet & Test (Go, deploy scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: python3 -m unittest discover -s deploy/tests
